# Local and Coolify "Docker Compose" deployment. In Coolify, set secrets in the UI, not in this file.
services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD}@db:5432/deskhub
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-https://hub.citichoice.net}
      CHATWOOT_URL: ${CHATWOOT_URL}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
      STAFF_UI_HOST: ${STAFF_UI_HOST}
      API_HOST: ${API_HOST}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_POST_LOGOUT_URI: ${OIDC_POST_LOGOUT_URI}
      OIDC_PROJECT_ID: ${OIDC_PROJECT_ID}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-administrator}
      WISECP_API_URL: ${WISECP_API_URL:-}
      WISECP_API_KEY: ${WISECP_API_KEY:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CUSTOMER_API_ENABLED: ${CUSTOMER_API_ENABLED:-false}
      ADJUSTMENT_SELF_APPROVAL_LIMIT_USD: ${ADJUSTMENT_SELF_APPROVAL_LIMIT_USD:-0}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
  worker:      # processes Chatwoot provisioning jobs; migrations are run by the hub service
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "worker"]
    environment:
      ENV: production
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD}@db:5432/deskhub
      SECRET_KEY: ${SECRET_KEY}
      CHATWOOT_URL: ${CHATWOOT_URL}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
    depends_on: [hub]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deskhub
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d deskhub"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
