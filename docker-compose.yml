# Local and Coolify "Docker Compose" deployment. In Coolify, set secrets in the UI, not in this file.
services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD}@db:5432/deskhub
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-https://hub.citichoice.net}
      CHATWOOT_URL: ${CHATWOOT_URL}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
      STAFF_UI_HOST: ${STAFF_UI_HOST}
      API_HOST: ${API_HOST}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_POST_LOGOUT_URI: ${OIDC_POST_LOGOUT_URI}
      OIDC_PROJECT_ID: ${OIDC_PROJECT_ID}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-administrator}
      WISECP_API_URL: ${WISECP_API_URL:-}
      WISECP_API_KEY: ${WISECP_API_KEY:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CUSTOMER_API_ENABLED: ${CUSTOMER_API_ENABLED:-false}
      ADJUSTMENT_SELF_APPROVAL_LIMIT_USD: ${ADJUSTMENT_SELF_APPROVAL_LIMIT_USD:-0}
      CHATWOOT_REPORT_TOKEN: ${CHATWOOT_REPORT_TOKEN:-}
      STATS_CACHE_SECONDS: ${STATS_CACHE_SECONDS:-120}
      PRICE_DISPLAY_MARKET: ${PRICE_DISPLAY_MARKET:-NG}
      SERVICE_MESSAGES_FREE: ${SERVICE_MESSAGES_FREE:-false}
      WISECP_TOPUP_ADDON_ID: ${WISECP_TOPUP_ADDON_ID:-48}
      WISECP_TOPUP_DESCRIPTION: "${WISECP_TOPUP_DESCRIPTION:-WhatsApp Prepaid Wallet Top-Up}"
      TOPUP_REVIEW_THRESHOLD_USD: ${TOPUP_REVIEW_THRESHOLD_USD:-0}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_WABA_TOKENS: ${META_WABA_TOKENS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      META_BILLING_START: ${META_BILLING_START:-}
      META_BILLING_LAG_HOURS: ${META_BILLING_LAG_HOURS:-36}
      NOTIFY_WA_PHONE_NUMBER_ID: ${NOTIFY_WA_PHONE_NUMBER_ID:-}
      NOTIFY_WA_TOKEN: ${NOTIFY_WA_TOKEN:-}
      NOTIFY_WA_REPORT_TEMPLATE: ${NOTIFY_WA_REPORT_TEMPLATE:-weekly_report}
      NOTIFY_WA_LOW_TEMPLATE: ${NOTIFY_WA_LOW_TEMPLATE:-low_balance_alert}
      NOTIFY_WA_LANGUAGE: ${NOTIFY_WA_LANGUAGE:-en}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-}"
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
  worker:      # processes Chatwoot provisioning jobs; migrations are run by the hub service
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "worker"]
    environment:
      ENV: production
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD}@db:5432/deskhub
      SECRET_KEY: ${SECRET_KEY}
      CHATWOOT_URL: ${CHATWOOT_URL}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
    depends_on: [hub]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deskhub
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d deskhub"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
